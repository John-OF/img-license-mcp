<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" width="800" height="510" role="img" aria-labelledby="title desc">
<title id="title">Img-License MCP demo</title>
<desc id="desc">An agent calls search_images, prepare_image, build_attribution and upload_to_wordpress: it finds a CC BY-SA photo whose licence was read at the source, converts it to a 1600 px WebP 46.5 % lighter, builds the credit line and uploads it with its provenance.</desc>
<style>
svg{--bg:#f2efe6;--soft:#e6e9f0;--ink:#1d2733;--mut:#47545f;--line:rgba(29,39,51,.16);--accent:#6247aa;--ok:#2e9457}
