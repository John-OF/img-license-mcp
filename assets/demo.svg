<text x="44" y="42" class="accent b">›</text>
<text x="58" y="42" class="ink t13">Find a photo for my Kyoto post that I can legally use, and upload it</text>
<g class="a1"><rect x="58" y="27" width="534" height="21" class="bgfill"/><rect x="58" y="29" width="7" height="16" class="accentfill a2"/></g>
<g class="a3">
<g class="a4"><circle cx="36" cy="92" r="5" class="spin"/></g>
<path d="M30 92 l4 5 l8 -9" class="tick a5"/>
<text x="52" y="96" class="accent b t13">search_images</text>
<text x="52" y="115" class="mut t11">query=&quot;Arashiyama bamboo forest&quot;</text>
</g>
<text x="52" y="136" class="ink t11 a6">→ 5 candidates · licence read at the source</text>
<g class="a7">
<g class="a8"><circle cx="36" cy="180" r="5" class="spin"/></g>
<path d="M30 180 l4 5 l8 -9" class="tick a9"/>
<text x="52" y="184" class="accent b t13">prepare_image</text>
<text x="52" y="203" class="mut t11">max_width=1600, format=&quot;webp&quot;</text>
</g>
<text x="52" y="224" class="ink t11 a10">→ 1920 px JPEG → 1600 px WebP · −46.5 %</text>
<g class="a11">
<g class="a12"><circle cx="36" cy="268" r="5" class="spin"/></g>
<path d="M30 268 l4 5 l8 -9" class="tick a13"/>
<text x="52" y="272" class="accent b t13">build_attribution</text>
<text x="52" y="291" class="mut t11">author=&quot;Basile Morin&quot;, &quot;CC BY-SA 4.0&quot;</text>
</g>
<text x="52" y="312" class="ink t11 a14">→ credit paragraph with 3 links</text>
<g class="a15">
<g class="a16"><circle cx="36" cy="356" r="5" class="spin"/></g>
<path d="M30 356 l4 5 l8 -9" class="tick a17"/>
<text x="52" y="360" class="accent b t13">upload_to_wordpress</text>
<text x="52" y="379" class="mut t11">alt_text, caption, provenance</text>
</g>
<text x="52" y="400" class="ink t11 a18">→ media #608 · metadata written</text>
<g class="a19">
<text x="30" y="462" class="ok b t13">✓</text>
<text x="52" y="462" class="ink b t13">Published with a verified licence</text>
<text x="52" y="482" class="mut t11">no licence, author or alt text was guessed</text>
</g>
<rect x="410" y="76" width="366" height="414" rx="6" class="card"/>
